<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Agent Usage Monitor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="widget" aria-label="Uso de Claude y Codex">
    <button id="toggle" class="toggle" aria-label="Mostrar detalle de uso" aria-expanded="false" aria-controls="providers footer"></button>
    <button id="quit" class="quit" aria-label="Cerrar">×</button>
    <section id="providers" aria-live="polite"></section>
    <footer id="footer" class="footer"></footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
